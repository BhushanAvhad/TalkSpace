
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta and Title -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wassup Chat App</title>
    <!-- External CSS Links -->
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Internal Styles -->
    <style>
        /* General Styles */
        body {
            background-color: rgb(240, 240, 240); /* Light gray background for the body */
            color: rgb(0, 0, 0);
            margin-top: 0; /* Remove margin to align text area to the bottom */
            display: flex;
            flex-direction: column;
            height: 100vh; /* Full height for the chat area */
        }

        .chat {
            flex: 1; /* Allow chat area to grow */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Align chat input to the bottom */
        }

        .my-message {
            background: #4CAF50; /* Updated color for my messages */
            transition: box-shadow 0.2s; /* Add transition for hover effect */
        }

        .my-message:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); /* Shadow effect on hover */
            color: black;
            margin-left: 0; /* Keep aligned to the left */
            margin-right: auto; /* Ensure it takes the full width on the left */
        }

        .my-message a {
            color: #000;
            text-decoration: none;
            font-weight: bold;
        }

        /* Login Overlay Styles */
      /* Login Overlay Styles */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7); /* Dark overlay */
    backdrop-filter: blur(10px); /* Blur effect */
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    --bs-text-opacity: 1;
    color: rgb(17, 213, 187) !important;
}
    .text-primary {
    --bs-text-opacity: 1;
    color: rgb(61, 13, 253) !important;
}
.login__form {
    background: linear-gradient(145deg, #6a11cb, #2575fc); /* Gradient background */
    border-radius: 20px;
    padding: 30px;
    width: 350px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    transform-style: preserve-3d;
    perspective: 1000px;
    transition: transform 0.5s ease, box-shadow 0.5s ease;
    animation: fadeIn 0.5s ease;
}

.login__form:hover {
    transform: rotateY(10deg) rotateX(10deg) translateZ(20px); /* 3D tilt effect */
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); /* Enhanced shadow on hover */
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Glowing Text Effect */
.login__form h2 {
    font-size: 2rem;
    color: white;
    text-shadow: 
        0 0 5px #fff, 
        0 0 10px #910505, 
        0 0 20px #06d4f0, 
        0 0 40px #099f2c; /* Glowing effect */
    margin-bottom: 20px;
}

/* Input Fields */
.login__form input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.1); /* Semi-transparent background */
    color: white;
    font-size: 16px;
    transition: background 0.3s ease, box-shadow 0.3s ease;
}

.login__form input::placeholder {
    color: rgba(255, 255, 255, 0.7); /* Light placeholder text */
}

.login__form input:focus {
    background: rgba(255, 255, 255, 0.2); /* Brighter background on focus */
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); /* Glow effect on focus */
    outline: none;
}

/* Login Button */
.login__form button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(145deg, #6a11cb, #2575fc); /* Gradient button */
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.login__form button:hover {
    background: linear-gradient(145deg, #2575fc, #6a11cb); /* Reverse gradient on hover */
    transform: translateY(-3px); /* Lift effect */
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3); /* Shadow on hover */
}

.login__form button:active {
    transform: translateY(0); /* Reset lift effect on click */
}

/* Error Message */
#errorMessage {
    margin-top: 10px;
    color: #ff6b6b; /* Red error text */
    font-size: 14px;
    text-shadow: 0 0 5px rgba(255, 107, 107, 0.5); /* Glow effect */
}

/* Additional Hover Effects */
.login__form input:hover {
    background: rgba(255, 255, 255, 0.2); /* Brighter background on hover */
}

.login__form input:hover::placeholder {
    color: rgba(255, 255, 255, 0.9); /* Brighter placeholder on hover */
}



.login__form {
    animation: rotate3D 5s infinite linear; /* Continuous 3D rotation */
}

        /* Chat App Styles*/
       
        .chat-app .people-list {
            width: 280px;
            position: absolute;
            left: 0;
            top: 0;
            padding: 20px;
            z-index: 7;
        }

        .chat-app .chat {
            margin-left: 280px;
            border-left: 2px solid #000000;
        }


        /* Message Styles */
        .chat-history {
            padding: 30px;
            overflow-y: auto;
            height: 640px; /* Increased height for the chat area */
            background: rgb(255, 255, 255);
        }

        .chat-history .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            margin-bottom: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .my-message {
            background: linear-gradient(145deg, #6ec1e4, #1e90ff); /* Gradient for sent messages */
            color: rgb(0, 0, 0);
           
            margin-left: 0; /* Align to the left */
            margin-right: auto; /* Ensure it takes the full width on the left */
            transition: box-shadow 0.2s; /* Add transition for hover effect */
        }

        .my-message:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); /* Shadow effect on hover */
        }

        .other-message {
            background: linear-gradient(145deg, #d1c4e9, #673ab7); /* Gradient for received messages */
            color: black;
         
            margin-right: 0; /* Align to the right */
            margin-left: auto; /* Ensure it takes the full width on the right */
            transition: box-shadow 0.2s; /* Add transition for hover effect */
        }

        .other-message:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); /* Shadow effect on hover */
            color: rgb(0, 0, 0);
            margin-right: 0; /* Keep aligned to the right */
            margin-left: auto; /* Ensure it takes the full width on the right */
        }

        /* Active Users List */
        #activeUsers li {
            cursor: pointer;
            transition: background 0.3s ease;
            padding: 10px;
            border-radius: 5px;
        }

        #activeUsers li:hover {
            background: #87cbff;
        }

        /* Chat Requests Section */
        .request-section {
            margin-top: 20px;
        }

        #chatRequests li {
            background: #ffffff;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        #chatRequests .btn {
            margin-left: 5px;
        }

        /* Back and Return Buttons */
        #backButton, #returnButton {
            display: none;
        }

        /* Profile Section Styling */
        .profile-section {
            text-align: center;
            margin-top: 10px;
        }

        .profile-box {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border: 2px solid #ff4500; /* Change profile box border color */
            border-radius: 10px;
            cursor: pointer;
        }

        .profile-picture {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .username {
            font-weight: bold;
            font-size: 16px;
            vertical-align: middle;
        }

        /* Responsive Adjustments */
        @media (max-width: 767px) {
            .chat-app .people-list {
                width: 100%;
                left: -100%;
                height: 100vh;
            }

            .chat-app .chat {
                margin-left: 0;
            }

            .request-section {
                width: 90%;
                right: 5%;
            }
        }

        /* Profile Popup Styling */
        .profile-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            background: rgb(74, 0, 194);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 1050;
            text-align: center;
        }

        .profile-popup-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-img {
            display: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-top: 10px;
        }

        .close-profile {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .message-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .message-header img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .message-header strong {
            font-weight: bold;
            font-size: 16px;
        }

        .my-message .message-header strong {
            color: rgba(0, 0, 0, 0.9);
        }

        /* Adjust message content spacing */
        .message-content {
            word-break: break-word;
            line-height: 1.4;
        }

        /* Dark Mode Styles */
        .dark-mode {
            background-color: #121212; /* Dark background */
        }

        .dark-mode .chat-history {
            background: #1e1e1e; /* Darker background for chat history */
        }
        
        .dark-mode .my-message {
            background: #083e91,#48b0e8; /* Darker color for my messages */
        }
        
        .dark-mode .other-message {
            background: #e39796 , #dfa318; /* Darker color for other messages */
        }

        /* Ensure only chat area text is white */
        .dark-mode .chat, .dark-mode .chat-header {
            color: #ffffff; /* Override text colors to white for chat area */
        }

        /* Specific styles for dashboard elements to remain unaffected */
        .people-list, .people-list * {
            color: rgb(0, 0, 0); /* Reset to default color for active users list */
            background-color: rgb(255, 255, 255); /* Reset to default background for active users list */
        }

        /* emoji */
        .emoji-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    margin-left: 10px;
}

.emoji-picker {
    position: absolute;
    bottom: 60px;
    left: 10px;
    background: white;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    width: 200px;
    max-height: 250px; /* Set a maximum height for the emoji picker */
    overflow-y: auto; /* Enable vertical scrolling */
    z-index: 1000; /* Ensure it appears above other elements */
}

.emoji-picker button {
    font-size: 20px;
    border: none;
    background: none;
    cursor: pointer;
}

.hidden {
    display: none;
}



/* Profile Section Styling */
.profile-section {
    text-align: center;
    margin-top: 20px;
    padding: 15px;
    background: linear-gradient(145deg, #ffffff, #f0f0f0);
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.profile-section:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
}

.profile-box {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    border: 2px solid #007bff; /* Blue border */
    border-radius: 15px;
    cursor: pointer;
    background: #ffffff;
    transition: background 0.3s ease, border-color 0.3s ease;
}

.profile-box:hover {
    background: #f0f8ff; /* Light blue background on hover */
    border-color: #0056b3; /* Darker blue border on hover */
}

.profile-picture {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    margin-right: 10px;
    border: 2px solid #007bff; /* Blue border */
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.profile-picture:hover {
    transform: scale(1.1); /* Slightly enlarge on hover */
    box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3); /* Glow effect */
}

.username {
    font-weight: bold;
    font-size: 18px;
    color: #333;
    transition: color 0.3s ease;
}

.profile-box:hover .username {
    color: #007bff; /* Blue text on hover */
}

#changeProfilePic {
    margin-top: 10px;
    background: linear-gradient(145deg, #007bff, #0056b3); /* Gradient button */
    color: white;
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#changeProfilePic:hover {
    background: linear-gradient(145deg, #0056b3, #003d80); /* Darker gradient on hover */
    transform: translateY(-2px); /* Lift effect */
    box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3); /* Glow effect */
}

#changeProfilePic:active {
    transform: translateY(0); /* Reset lift effect on click */
}

/* Profile Popup Styling */
.profile-popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    background: #ffffff;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    z-index: 1050;
    text-align: center;
}

.profile-popup-content {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.profile-img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin-bottom: 15px;
    border: 3px solid #007bff; /* Blue border */
    transition: transform 0.3s ease;
}

.profile-img:hover {
    transform: scale(1.1); /* Slightly enlarge on hover */
}

.close-profile {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 20px;
    color: #333;
    cursor: pointer;
    transition: color 0.3s ease;
}

.close-profile:hover {
    color: #007bff; /* Blue color on hover */
}

#profilePicInput {
    margin-top: 10px;
    padding: 8px;
    border: 2px solid #007bff;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.3s ease;
}

#profilePicInput:hover {
    border-color: #0056b3; /* Darker blue border on hover */
}

#saveProfile {
    margin-top: 15px;
    background: linear-gradient(145deg, #007bff, #0056b3); /* Gradient button */
    color: white;
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#saveProfile:hover {
    background: linear-gradient(145deg, #0056b3, #003d80); /* Darker gradient on hover */
    transform: translateY(-2px); /* Lift effect */
    box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3); /* Glow effect */
}

#saveProfile:active {
    transform: translateY(0); /* Reset lift effect on click */
}


    </style>
</head>

<body>
    <!-- Login Overlay -->
    <div class="overlay" id="loginOverlay">
        <div class="login__form">
            <h2 class="text-primary glowing-text" id="authTitle">Login to Wassup</h2>
            <input type="text" id="username" class="form-control mb-2" placeholder="Enter your username" required style="border-radius: 15px;">
            <input type="password" id="password" class="form-control mb-3" placeholder="Enter your password" required style="border-radius: 15px;">
            <button id="authSubmitBtn" class="btn btn-primary w-100" style="background-color: #007bff; border-radius: 15px; font-weight: bold;">Login</button>
            <div class="mt-3">
                <a href="#" id="authToggleLink" style="color: #ffffff; text-decoration: underline; font-size: 14px;">Don't have an account? Sign Up</a>
            </div>
            <div id="errorMessage" class="text-danger mt-2" style="font-weight: 500;"></div>
        </div>
    </div>

    <!-- Chat Application -->
    <div class="container-fluid">
        <div class="card chat-app">
            <!-- People List (Left Sidebar) -->
            <div class="people-list">
                <!-- Search Bar -->
                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="Search...">
                    <button class="btn btn-outline-secondary"><i class="fa fa-search"></i></button>
                </div>
                <!-- Active Users -->
                <h5 class="text-primary">Active Users</h5>
                <ul class="list-unstyled chat-list mt-2 mb-0" id="activeUsers">
                    <!-- Active users will be populated here -->
                </ul>
                <!-- Chat Requests Section -->
                <div class="request-section">
                    <h5 class="text-primary">Chat Requests</h5>
                    <ul class="list-unstyled" id="chatRequests">
                        <!-- Chat requests will appear here -->
                    </ul>
                </div>
                <div class="profile-section">
                    <div class="profile-box">
                        <img src="profile.png" alt="Profile Picture" class="profile-picture">
                        <span class="username" id="usernameDisplay"></span>
                    </div>
                </div>
            </div>


            

            <!-- Main Chat Area -->
            <div class="chat">
                <!-- Chat Header -->
                <div class="chat-header clearfix">
                    <div class="row align-items-center">
                        <div class="col-6">
                            <!-- Back Button -->
                            <button id="backButton" class="btn btn-outline-secondary me-2">
                                <i class="fa fa-arrow-left"></i> Back
                            </button>
                            <!-- Return Button -->
                            <button id="returnButton" class="btn btn-outline-secondary me-2">
                                <i class="fa fa-arrow-right"></i> Return
                            </button>
                            <!-- Chat Info -->
                            <img src="chat.png" alt="avatar" class="rounded-circle me-2" width="40">
                            <div class="d-inline-block">
                                <h6 class="m-0" id="chatHeaderTitle">Group Chat</h6>
                                <small class="text-muted" id="chatHeaderSub">Online: <span id="onlineCount">0</span></small>
                            </div>
                        </div>
                        <div class="col-6 text-end">
                            <!-- Settings Button -->
                            <button class="btn btn-outline-secondary" id="settingsButton" title="Toggle Theme"><i class="fa fa-cog"></i></button>
                            <button class="btn btn-outline-secondary" id="logoutButton" title="Logout"><i class="fa fa-sign-out"></i></button>

                        </div>
                    </div>
                </div>

                <!-- Chat History -->
                <div class="chat-history" >
                    <ul class="m-b-0" id="messageArea">
                        <!-- Messages will be inserted here -->
                    </ul>
                   
                    <div id="typingIndicator" class="text-muted px-3 py-1"></div>
                </div>

                <!-- Message Input -->
                    <div class="chat-message clearfix" id="messageInputArea" style="margin-top: auto; transition: all 0.3s;">

                    <div class="input-group">
                        <button id="emojiBtn" class="btn btn-outline-secondary" title="Emoji Picker">
                            <i class="fa fa-smile-o"></i>
                        </button>
                        <!-- Emoji Button -->
                        <div id="emojiPicker" class="emoji-picker hidden">
                            <!-- Emojis will be populated here from emojicpe.txt -->
                        </div>
                        <!-- Message Input -->
                        <textarea id="textarea" class="form-control" placeholder="Write a message..." rows="1"></textarea>
                        
                        <button id="sendBtn" class="btn btn-primary" style="background: linear-gradient(145deg, #6a11cb, #2575fc); border: none; border-radius: 5px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); transition: transform 0.2s, box-shadow 0.2s;">
                <i class="fa fa-send"></i>
            </button>
                        <!-- Removed the second attachment button -->
                    </div>                    
                </div>
            </div>
            <!-- Bottom Navigation Bar -->
<div class="bottom-nav">
    <a href="#" class="nav-item active"><i class="fa fa-home"></i></a>
    <a href="#" class="nav-item"><i class="fa fa-search"></i></a>
    <a href="#" class="nav-item"><i class="fa fa-plus-square"></i></a>
    <a href="#" class="nav-item"><i class="fa fa-heart"></i></a>
    <a href="#" class="nav-item"><i class="fa fa-user"></i></a>
</div>
        </div>
    </div>

    <!-- Notification Sound -->
    <audio id="notificationSound" src="notification.mp3" preload="auto"></audio>

    <!-- External JS Libraries -->
    <script src="https://cdn.polyfill.io/v3/polyfill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@joeattardi/emoji-button/dist/emoji-button.min.js"></script>

    <!-- Socket.IO Client Library -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Error Handling Script -->
    <script src="errorHandling.js"></script>
    <script src="notifications.js"></script>

    <!-- Your Client Script -->
    <script src="/client.js"></script>

<script>
    // Toggle dark mode
    const settingsButton = document.getElementById('settingsButton');
    settingsButton.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
    });

    // Logout functionality
    document.getElementById('logoutBtn').addEventListener('click', () => {
        window.location.href = 'index.html'; // Redirect to the login window
    });

    // Emoji picker functionality
 
    
    </script>

</body>
</html>
